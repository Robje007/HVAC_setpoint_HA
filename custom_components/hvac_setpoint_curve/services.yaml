set_curve:
  name: Set curve
  description: Update the shared visual heating/cooling outdoor-temperature setpoint curve for one config entry.
  fields:
    entry_id:
      name: Config entry ID
      description: Entry ID of the HVAC Setpoint Curve instance.
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Which curve to update. Use both for the shared custom curve.
      required: true
      selector:
        select:
          options:
            - cooling
            - heating
            - both
    points:
      name: Curve points
      description: List of objects with outdoor_temp and setpoint values.
      required: true
      example:
        - outdoor_temp: 18
          setpoint: 23
        - outdoor_temp: 26
          setpoint: 21
        - outdoor_temp: 35
          setpoint: 20
      selector:
        object:

set_profile:
  name: Set building profile
  description: Save heating and cooling comfort curves together for the visual editor.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    heating_points:
      name: Heating points
      required: true
      selector:
        object:
    cooling_points:
      name: Cooling points
      required: true
      selector:
        object:
